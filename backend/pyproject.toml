[project]
name = "autoviz"
version = "0.1.0"
description = "AutoViz AI - MCP server for LLM-guided, validated CSV analysis and Vega-Lite chart generation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.2",
    # Parquet engine for the durable dataset blobs (pandas has no built-in one).
    "pyarrow>=17.0",
    # .xlsx reader for services/ingest.py (pandas has no built-in one either).
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-google-genai>=4.3.1",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "pwdlib[argon2]>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.9.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
