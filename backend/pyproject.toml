[project]
name = "autoviz"
version = "0.1.0"
description = "AutoViz AI - MCP server for LLM-guided, validated CSV analysis and Vega-Lite chart generation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.2",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-google-genai>=4.3.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
