services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autoviz
      POSTGRES_PASSWORD: autoviz
      POSTGRES_DB: autoviz
    ports:
      - "5432:5432"
    volumes:
      - autoviz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoviz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  autoviz_pgdata:
