services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autoviz
      POSTGRES_PASSWORD: autoviz
      POSTGRES_DB: autoviz
    ports:
      # Host 5434 avoids clashing with system Postgres (5432) and stale 5433 binds.
      - "5434:5432"
    volumes:
      - autoviz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoviz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Entrypoint runs `alembic upgrade head`, then uvicorn on :8000.
    environment:
      # In-network Postgres (service name `db`). psycopg2 handles postgresql://.
      DATABASE_URL: postgresql://autoviz:autoviz@db:5432/autoviz
      SECRET_KEY: ${SECRET_KEY:-autoviz-dev-secret-key-change-in-production}
      AUTOVIZ_CORS_ORIGINS: ${AUTOVIZ_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Resident DataFrame budget before the registry evicts least-recently-used
      # datasets. Evicted frames reload from their stored Parquet blob on demand.
      AUTOVIZ_REGISTRY_MEMORY_BYTES: ${AUTOVIZ_REGISTRY_MEMORY_BYTES:-536870912}
      # Set to "postgres" for durable LangGraph agent threads across restarts.
      AUTOVIZ_AGENT_CHECKPOINTER: ${AUTOVIZ_AGENT_CHECKPOINTER:-}
      # Only needed for the /agent routes.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Planner model override (falls back to the in-code default if unset).
      AUTOVIZ_PLANNER_MODEL: ${AUTOVIZ_PLANNER_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Staging only — uploads are parsed, stored in Postgres as Parquet, then
      # deleted. Nothing durable lives here; the mount just avoids writing into
      # the container's own layer.
      - autoviz_uploads:/app/uploads

volumes:
  autoviz_pgdata:
  autoviz_uploads:
