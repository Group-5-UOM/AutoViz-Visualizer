server {
    listen 80;

    # Serve the compiled React static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the backend Uvicorn server inside Docker
    location /api/ {
        # Strip the /api prefix before forwarding (e.g. /api/auth/login -> /auth/login)
        rewrite ^/api/(.*) /$1 break;
        
        # 'api' matches the service name in docker-compose.local.yml
        proxy_pass http://api:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
