name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build frontend
      run: npm run build

    - name: Start Docker Compose environment
      working-directory: .
      run: |
        touch .env
        docker compose -f docker-compose.local.yml up -d --build
        echo "Waiting for services to start..."
        for i in {1..30}; do
          if curl -s -f http://localhost/api/health > /dev/null 2>&1; then
            echo "Services are up and healthy!"
            break
          fi
          echo "Waiting for backend API & database to be ready... ($i/30)"
          sleep 2
        done

    - name: Run Playwright tests
      run: npm run test:e2e

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

    - name: Upload Test Results on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: frontend/test-results/
        retention-days: 30

    - name: Teardown Docker Compose
      if: always()
      working-directory: .
      run: docker compose -f docker-compose.local.yml down -v
