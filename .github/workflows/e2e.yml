name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Start Docker Compose environment
      working-directory: .
      run: |
        docker compose -f docker-compose.local.yml up -d --build
        # Wait for the frontend Nginx router and backend API to become healthy
        echo "Waiting for services to start..."
        sleep 20
        # Optional: wait-on could be used here to strictly poll localhost:80

    - name: Run Playwright tests
      run: npm run test:e2e

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

    - name: Upload Test Results on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: frontend/test-results/
        retention-days: 30

    - name: Teardown Docker Compose
      if: always()
      working-directory: .
      run: docker compose -f docker-compose.local.yml down -v
