services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autoviz
      POSTGRES_PASSWORD: autoviz
      POSTGRES_DB: autoviz
    ports:
      - "5434:5432"
    env_file:
      - .env
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoviz"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://autoviz:autoviz@db:5432/autoviz
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # We don't expose 8000 here because Nginx handles the routing on port 80.
    # The frontend container can still talk to it via http://api:8000 internally.

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Mount the compiled React files so Nginx can serve them
      - ./frontend/dist:/usr/share/nginx/html
      # Mount our local Nginx config to proxy the /api requests
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped

volumes:
  local_pgdata:
